<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Zoom Casa — Property Not Eligible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-card: #18181b;
            --bg-elevated: #1f1f23;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Subtle ambient glow background, matching the netsheet aesthetic */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 580px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .logo {
            height: 60px;
            width: auto;
            margin: 0 auto 16px;
            display: block;
        }

        .label {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 44px 36px;
            border: 1px solid var(--border-subtle);
            text-align: left;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.3;
            text-align: center;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        .address {
            color: var(--text-primary);
            font-weight: 500;
        }

        .value {
            color: var(--text-primary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .threshold {
            color: var(--accent-blue);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 22px; }
            .logo { height: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="Zoom Casa (white).png" alt="Zoom Casa">
        <p class="label">Net Sheet Calculator</p>
        <div class="card">
            <h1>Thanks for considering Zoom Casa</h1>
            <div id="content"></div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const address = params.get('address');
        const valueRaw = params.get('value');
        const value = valueRaw && !isNaN(parseInt(valueRaw, 10))
            ? parseInt(valueRaw, 10)
            : null;

        const formatCurrency = (n) => '$' + n.toLocaleString('en-US');

        const escapeHtml = (s) => {
            const div = document.createElement('div');
            div.textContent = s ?? '';
            return div.innerHTML;
        };

        const content = document.getElementById('content');

        let html = '';
        if (address && value !== null) {
            // Property valued below the $300k threshold
            html = `
                <p>Based on the estimated value of your property at <span class="address">${escapeHtml(address)}</span> (approximately <span class="value">${formatCurrency(value)}</span>), it falls below our current minimum threshold of <span class="threshold">$300,000</span>.</p>
                <p>Our program is designed for homes valued at $300,000 or more. We'd love to help once your property fits that range.</p>
                <p>In the meantime, you may want to consider a traditional listing with a local agent.</p>
            `;
        } else if (address) {
            // No reliable valuation found
            html = `
                <p>We weren't able to find a reliable valuation for your property at <span class="address">${escapeHtml(address)}</span> at this time.</p>
                <p>Our program is designed for homes valued at <span class="threshold">$300,000</span> or more. Please try again later, or consider a traditional listing with a local agent.</p>
            `;
        } else {
            // Page hit with no params at all
            html = `
                <p>Our program is designed for homes valued at <span class="threshold">$300,000</span> or more.</p>
                <p>If your property fits that range, please return to the calculator. Otherwise, you may want to consider a traditional listing with a local agent.</p>
            `;
        }
        content.innerHTML = html;
    </script>
</body>
</html>
